name: human-reconciliation-fast-ci

# Offline synthetic reconciliation-readiness, descriptive publisher and
# independent publication-verifier checks. Never generates human ratings.
on:
  push:
    branches:
      - "research-*"
    paths:
      - .github/workflows/human-reconciliation-fast-ci.yml
      - scripts/verify_human_reconciliation_readiness.py
      - scripts/reconcile_human_automated.py
      - scripts/verify_human_reconciliation_outputs.py
      - scripts/verify_human_eval_analysis_outputs.py
      - scripts/human_eval_analysis_core.py
      - scripts/analyze_main_study.py
      - scripts/verify_analysis_provenance.py
      - scripts/verify_main_study_execution.py
      - scripts/verify_main_study_outputs.py
      - scripts/build_analysis_provenance.py
      - tests/test_human_reconciliation_readiness.py
      - tests/test_human_reconciliation_readiness_file_identity.py
      - tests/test_human_reconciliation_readiness_input_bounds.py
      - tests/test_human_reconciliation_readiness_json_numbers.py
      - tests/test_human_reconciliation_readiness_json_structure_bounds.py
      - tests/test_human_reconciliation_legacy_source_binding.py
      - tests/test_human_reconciliation_execution.py
      - tests/test_human_reconciliation_artifact_size_contract.py
      - tests/test_human_reconciliation_output_verification.py
      - tests/test_human_reconciliation_fast_ci_workflow.py
      - tests/human_eval_test_support.py
      - paper/HUMAN_RECONCILIATION_FREEZE.md
      - paper/HUMAN_EVAL_ANALYSIS_PLAN.md
      - paper/HUMAN_EVAL_PROTOCOL.md
      - scripts/run_offline_pytest_firewalled.sh
      - scripts/verify_ci_python_runtime.py
      - scripts/verify_ci_source_checkout.py
      - scripts/verify_ci_test_evidence.py
      - scripts/verify_retained_ci_test_evidence.py
      - requirements.txt
      - requirements-ci.lock
      - .python-version
  pull_request:
    paths:
      - .github/workflows/human-reconciliation-fast-ci.yml
      - scripts/verify_human_reconciliation_readiness.py
      - scripts/reconcile_human_automated.py
      - scripts/verify_human_reconciliation_outputs.py
      - scripts/verify_human_eval_analysis_outputs.py
      - scripts/human_eval_analysis_core.py
      - scripts/analyze_main_study.py
      - scripts/verify_analysis_provenance.py
      - scripts/verify_main_study_execution.py
      - scripts/verify_main_study_outputs.py
      - scripts/build_analysis_provenance.py
      - tests/test_human_reconciliation_readiness.py
      - tests/test_human_reconciliation_readiness_file_identity.py
      - tests/test_human_reconciliation_readiness_input_bounds.py
      - tests/test_human_reconciliation_readiness_json_numbers.py
      - tests/test_human_reconciliation_readiness_json_structure_bounds.py
      - tests/test_human_reconciliation_legacy_source_binding.py
      - tests/test_human_reconciliation_execution.py
      - tests/test_human_reconciliation_artifact_size_contract.py
      - tests/test_human_reconciliation_output_verification.py
      - tests/test_human_reconciliation_fast_ci_workflow.py
      - tests/human_eval_test_support.py
      - paper/HUMAN_RECONCILIATION_FREEZE.md
      - paper/HUMAN_EVAL_ANALYSIS_PLAN.md
      - paper/HUMAN_EVAL_PROTOCOL.md
      - scripts/run_offline_pytest_firewalled.sh
      - scripts/verify_ci_python_runtime.py
      - scripts/verify_ci_source_checkout.py
      - scripts/verify_ci_test_evidence.py
      - scripts/verify_retained_ci_test_evidence.py
      - requirements.txt
      - requirements-ci.lock
      - .python-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Pin offline Python interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.17"
          pip-version: "26.2.1"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.lock

      - name: Verify runtime and source before installing dependencies
        run: |
          python -m scripts.verify_ci_python_runtime --phase before-tests
          python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase before-tests

      - name: Install pinned reconciliation-test dependencies only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps \
            --only-binary=:all: --retries 1 --timeout 15 \
            --constraint requirements-ci.lock --constraint requirements.txt \
            pytest pluggy iniconfig packaging PyYAML markdown-it-py mdurl
          python -m pip check

      - name: Compile reconciliation implementation and regressions
        run: |
          python -m py_compile \
            scripts/verify_human_reconciliation_readiness.py \
            scripts/reconcile_human_automated.py \
            scripts/verify_human_reconciliation_outputs.py \
            scripts/verify_human_eval_analysis_outputs.py \
            scripts/human_eval_analysis_core.py \
            scripts/analyze_main_study.py \
            scripts/verify_analysis_provenance.py \
            scripts/verify_main_study_execution.py \
            scripts/verify_main_study_outputs.py \
            scripts/build_analysis_provenance.py \
            tests/test_human_reconciliation_readiness.py \
            tests/test_human_reconciliation_readiness_file_identity.py \
            tests/test_human_reconciliation_readiness_input_bounds.py \
            tests/test_human_reconciliation_readiness_json_numbers.py \
            tests/test_human_reconciliation_readiness_json_structure_bounds.py \
            tests/test_human_reconciliation_legacy_source_binding.py \
            tests/test_human_reconciliation_execution.py \
            tests/test_human_reconciliation_artifact_size_contract.py \
            tests/test_human_reconciliation_output_verification.py \
            tests/test_human_reconciliation_fast_ci_workflow.py

      - name: Verify source immediately before reconciliation tests
        run: python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase before-tests

      - name: Run firewalled reconciliation regressions
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          bash scripts/run_offline_pytest_firewalled.sh tests/test_human_reconciliation_readiness.py tests/test_human_reconciliation_readiness_file_identity.py tests/test_human_reconciliation_readiness_input_bounds.py tests/test_human_reconciliation_readiness_json_numbers.py tests/test_human_reconciliation_readiness_json_structure_bounds.py tests/test_human_reconciliation_legacy_source_binding.py tests/test_human_reconciliation_execution.py tests/test_human_reconciliation_artifact_size_contract.py tests/test_human_reconciliation_output_verification.py tests/test_human_reconciliation_fast_ci_workflow.py 2>&1 | tee "$RUNNER_TEMP/vera-human-reconciliation-tests.log"

      - name: Verify runtime and source after reconciliation tests
        run: |
          python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase after-tests
          python -m scripts.verify_ci_python_runtime --phase after-tests

      - name: Bind exact-commit reconciliation-test evidence
        run: |
          python -m scripts.verify_ci_test_evidence \
            --log "$RUNNER_TEMP/vera-human-reconciliation-tests.log" \
            --out "$RUNNER_TEMP/vera-human-reconciliation-test-receipt.json"

      - name: Replay reconciliation-test evidence before retention
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_retained_ci_test_evidence \
            --log "$RUNNER_TEMP/vera-human-reconciliation-tests.log" \
            --receipt "$RUNNER_TEMP/vera-human-reconciliation-test-receipt.json" \
            --checkout-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME"

      - name: Retain source-bound reconciliation regression evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-human-reconciliation-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vera-human-reconciliation-tests.log
            ${{ runner.temp }}/vera-human-reconciliation-test-receipt.json
          if-no-files-found: error
          retention-days: 90
