name: main-study-numeric-input-integrity

on:
  push:
    branches: [research-paper-eval-2027]
    paths:
      - "scripts/audit_main_study_numeric_inputs.py"
      - "scripts/verify_published_main_study_inputs.py"
      - "scripts/verify_research_artifact_manifest.py"
      - "scripts/fingerprint_research_artifacts.py"
      - "outputs/main_study_analysis_inputs_manifest.json"
      - "tests/test_main_study_numeric_ci_source_binding.py"
      - "tests/test_main_study_numeric_integrity.py"
      - "outputs/main_study_runs.csv"
      - "outputs/posthoc_support_runs.csv"
      - "docs/MAIN_STUDY_NUMERIC_INPUT_INTEGRITY.md"
      - ".github/workflows/main-study-numeric-input-integrity.yml"
  pull_request:
    paths:
      - "scripts/audit_main_study_numeric_inputs.py"
      - "scripts/verify_published_main_study_inputs.py"
      - "scripts/verify_research_artifact_manifest.py"
      - "scripts/fingerprint_research_artifacts.py"
      - "outputs/main_study_analysis_inputs_manifest.json"
      - "tests/test_main_study_numeric_ci_source_binding.py"
      - "tests/test_main_study_numeric_integrity.py"
      - "outputs/main_study_runs.csv"
      - "outputs/posthoc_support_runs.csv"
      - "docs/MAIN_STUDY_NUMERIC_INPUT_INTEGRITY.md"
      - ".github/workflows/main-study-numeric-input-integrity.yml"

permissions:
  contents: read

jobs:
  offline-numeric-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.17"
      - name: Numeric evidence preflight (no inference or network APIs)
        run: |
          python -m compileall -q scripts/audit_main_study_numeric_inputs.py scripts/verify_published_main_study_inputs.py
          python -m scripts.verify_published_main_study_inputs
          python -m scripts.audit_main_study_numeric_inputs
