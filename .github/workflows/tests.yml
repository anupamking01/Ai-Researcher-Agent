name: tests

on:
  push:
    branches:
      - main
      - "research-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    # Preserve independent shard results even if one fails.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.17"
          pip-version: "26.2.1"
          cache: pip

      - name: Verify pinned CI Python runtime before tests
        run: python -m scripts.verify_ci_python_runtime --phase before-tests

      - name: Verify pinned Python before dependency-free diagnostic gate
        run: python -m scripts.verify_ci_python_runtime --phase before-tests

      - name: Verify exact checkout before dependency-free diagnostic gate
        run: python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase before-tests

      - name: Run dependency-free diagnostic invariants before pip installation
        shell: bash
        run: |
          set -euo pipefail
          printf 'VERA EARLY DIAGNOSTIC: sha=%s run=%s attempt=%s event=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" | tee "$RUNNER_TEMP/vera-stdlib-evaluation.log"
          python -m unittest discover -s tests -p 'test_evaluation_stdlib_gate.py' -v 2>&1 | tee -a "$RUNNER_TEMP/vera-stdlib-evaluation.log"

      - name: Verify exact checkout after dependency-free diagnostic gate
        run: python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase after-tests

      - name: Bind dependency-free test transcript to commit and run
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_ci_early_gate_evidence \
            --mode create \
            --log "$RUNNER_TEMP/vera-stdlib-evaluation.log" \
            --receipt "$RUNNER_TEMP/vera-stdlib-evaluation-receipt.json" \
            --checkout-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY"

      - name: Independently replay dependency-free evidence before retention
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_ci_early_gate_evidence \
            --mode verify \
            --log "$RUNNER_TEMP/vera-stdlib-evaluation.log" \
            --receipt "$RUNNER_TEMP/vera-stdlib-evaluation-receipt.json" \
            --checkout-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY"

      - name: Retain pre-install diagnostic evidence (90 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-stdlib-evaluation-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vera-stdlib-evaluation.log
            ${{ runner.temp }}/vera-stdlib-evaluation-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Install application and test dependencies
        run: |
          python -m pip install --no-deps -r requirements.txt
          python -m pip install --no-deps -r requirements-ci.lock
          python -m pip check

      - name: Verify installed CI dependencies before tests
        run: python -m scripts.verify_ci_installed_dependencies --phase before-tests

      - name: Compile research code
        run: python -m compileall -q agent logic scripts tests settings scrape text_preprocess

      - name: Verify exact source checkout before tests
        run: python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase before-tests

      - name: Run offline unit tests
        shell: bash
        env:
          VERA_SHARD: "${{ matrix.shard }}"
        run: |
          set -euo pipefail
          python -m scripts.select_full_ci_shard --verify-partition --shards 8
          python -m scripts.select_full_ci_shard --shard "$VERA_SHARD" --shards 8 > "$RUNNER_TEMP/vera-offline-test-modules.txt"
          mapfile -t test_modules < "$RUNNER_TEMP/vera-offline-test-modules.txt"
          (( ${#test_modules[@]} > 0 ))
          printf 'VERA full-suite shard %s/8; selected %s modules; checkout %s\n' "$VERA_SHARD" "${#test_modules[@]}" "$GITHUB_SHA" | tee "$RUNNER_TEMP/vera-offline-tests.log"
          cat "$RUNNER_TEMP/vera-offline-test-modules.txt" | tee -a "$RUNNER_TEMP/vera-offline-tests.log"
          bash scripts/run_offline_pytest_firewalled.sh "${test_modules[@]}" 2>&1 | tee -a "$RUNNER_TEMP/vera-offline-tests.log"

      - name: Verify exact source checkout after tests
        run: python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase after-tests

      - name: Verify installed CI dependencies after tests
        run: python -m scripts.verify_ci_installed_dependencies --phase after-tests

      - name: Verify pinned CI Python runtime after tests
        run: python -m scripts.verify_ci_python_runtime --phase after-tests

      - name: Bind exact-commit offline test evidence
        run: |
          python -m scripts.verify_ci_test_evidence \
            --log "$RUNNER_TEMP/vera-offline-tests.log" \
            --out "$RUNNER_TEMP/vera-offline-test-receipt.json" \
            --selected-modules "$RUNNER_TEMP/vera-offline-test-modules.txt" \
            --shard "${{ matrix.shard }}"

      - name: Replay exact-commit offline test evidence before upload
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_retained_ci_test_evidence \
            --log "$RUNNER_TEMP/vera-offline-tests.log" \
            --receipt "$RUNNER_TEMP/vera-offline-test-receipt.json" \
            --checkout-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --selected-modules "$RUNNER_TEMP/vera-offline-test-modules.txt" \
            --shard "${{ matrix.shard }}"

      - name: Retain source-bound offline test evidence (90 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-offline-tests-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vera-offline-tests.log
            ${{ runner.temp }}/vera-offline-test-receipt.json
            ${{ runner.temp }}/vera-offline-test-modules.txt
          if-no-files-found: error
          retention-days: 90
