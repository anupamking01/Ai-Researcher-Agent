name: tests

on:
  push:
    branches:
      - main
      - "research-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.17"
          pip-version: "26.2.1"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --no-deps -r requirements.txt
          python -m pip install --no-deps -r requirements-ci.lock
          python -m pip check

      - name: Compile research code
        run: python -m compileall -q agent logic scripts tests settings scrape text_preprocess

      - name: Run offline unit tests
        run: python -m pytest -q
