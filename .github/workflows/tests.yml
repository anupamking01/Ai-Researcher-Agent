name: tests

on:
  push:
    branches:
      - main
      - "research-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.17"
          pip-version: "26.2.1"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --no-deps -r requirements.txt
          python -m pip install --no-deps -r requirements-ci.lock
          python -m pip check

      - name: Verify installed CI dependencies before tests
        run: python -m scripts.verify_ci_installed_dependencies --phase before-tests

      - name: Compile research code
        run: python -m compileall -q agent logic scripts tests settings scrape text_preprocess

      - name: Verify exact source checkout before tests
        run: python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase before-tests

      - name: Run offline unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_offline_pytest_firewalled.sh 2>&1 | tee "$RUNNER_TEMP/vera-offline-tests.log"

      - name: Verify exact source checkout after tests
        run: python -m scripts.verify_ci_source_checkout --checkout-sha "$GITHUB_SHA" --phase after-tests

      - name: Verify installed CI dependencies after tests
        run: python -m scripts.verify_ci_installed_dependencies --phase after-tests

      - name: Bind exact-commit offline test evidence
        run: |
          python -m scripts.verify_ci_test_evidence \
            --log "$RUNNER_TEMP/vera-offline-tests.log" \
            --out "$RUNNER_TEMP/vera-offline-test-receipt.json"

      - name: Replay exact-commit offline test evidence before upload
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_retained_ci_test_evidence \
            --log "$RUNNER_TEMP/vera-offline-tests.log" \
            --receipt "$RUNNER_TEMP/vera-offline-test-receipt.json" \
            --checkout-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME"

      - name: Retain source-bound offline test evidence (90 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-offline-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vera-offline-tests.log
            ${{ runner.temp }}/vera-offline-test-receipt.json
          if-no-files-found: error
          retention-days: 90
