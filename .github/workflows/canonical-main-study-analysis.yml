name: canonical-main-study-analysis

on:
  workflow_dispatch:
  push:
    branches:
      - research-paper-eval-2027
    paths:
      - experiments/run_canonical_analysis.trigger

concurrency:
  group: canonical-main-study-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      CANONICAL_RECOVERY_RUN_ID: "34783525480"
      CANONICAL_RECOVERY_ARTIFACT: "budget-main-study-recovered-34783525480"

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run offline analysis guardrail tests
        run: |
          python -m pytest -q             tests/test_canonical_analysis_workflow.py             tests/test_main_study_analysis.py             tests/test_main_study_input_preflight.py             tests/test_verified_main_study_analysis.py             tests/test_main_study_output_verification.py             tests/test_analysis_provenance.py             tests/test_analysis_provenance_verification.py

      - name: Download canonical recovered study artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANONICAL_RECOVERY_ARTIFACT }}
          path: outputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: anupamking01/Ai-Researcher-Agent
          run-id: ${{ env.CANONICAL_RECOVERY_RUN_ID }}

      - name: Record immutable source selection
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "analysis_commit": os.environ["GITHUB_SHA"],
              "recovery_run_id": int(os.environ["CANONICAL_RECOVERY_RUN_ID"]),
              "recovery_artifact": os.environ["CANONICAL_RECOVERY_ARTIFACT"],
          }
          Path("outputs/canonical_analysis_source.json").write_text(
              json.dumps(source, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Fingerprint exact canonical analysis inputs
        run: |
          python -m scripts.fingerprint_research_artifacts             outputs/main_study_runs.csv             outputs/posthoc_support_runs.csv             --output outputs/main_study_analysis_inputs_manifest.json

      - name: Run frozen provenance-gated analysis
        run: |
          python -m scripts.run_verified_main_study_analysis             outputs/main_study_analysis_inputs_manifest.json

      - name: Independently verify analysis receipt
        run: |
          python -m scripts.verify_analysis_provenance             outputs/main_study_analysis_provenance.json
          python -m scripts.verify_main_study_outputs

      - name: Upload canonical analysis bundle
        uses: actions/upload-artifact@v4
        with:
          name: canonical-main-study-analysis-${{ github.run_id }}
          path: |
            outputs/canonical_analysis_source.json
            outputs/main_study_analysis_inputs_manifest.json
            outputs/main_study_analysis_provenance.json
            outputs/main_study_inference.json
            outputs/main_study_runs.csv
            outputs/posthoc_support_runs.csv
            paper/MAIN_STUDY_INFERENCE.md
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified canonical analysis snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            outputs/canonical_analysis_source.json \
            outputs/main_study_analysis_inputs_manifest.json \
            outputs/main_study_analysis_provenance.json \
            outputs/main_study_inference.json \
            outputs/main_study_runs.csv \
            outputs/posthoc_support_runs.csv \
            paper/MAIN_STUDY_INFERENCE.md

          python - <<'PY'
          import subprocess

          expected = {
              "outputs/canonical_analysis_source.json",
              "outputs/main_study_analysis_inputs_manifest.json",
              "outputs/main_study_analysis_provenance.json",
              "outputs/main_study_inference.json",
              "outputs/main_study_runs.csv",
              "outputs/posthoc_support_runs.csv",
              "paper/MAIN_STUDY_INFERENCE.md",
          }
          staged = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )
          unexpected = staged - expected
          if unexpected:
              raise SystemExit(f"Refusing to publish unexpected staged paths: {sorted(unexpected)}")
          missing = expected - staged
          if missing:
              print(f"Already tracked and unchanged or missing from staged diff: {sorted(missing)}")
          PY

          # The canonical CSVs are byte-fingerprinted with CRLF line endings
          # from Python's csv writer. Do not normalize those verified bytes just
          # to satisfy Git's trailing-whitespace heuristic. Check only the
          # non-CSV manuscript/provenance artifacts for whitespace errors.
          git diff --cached --check -- \
            outputs/canonical_analysis_source.json \
            outputs/main_study_analysis_inputs_manifest.json \
            outputs/main_study_analysis_provenance.json \
            outputs/main_study_inference.json \
            paper/MAIN_STUDY_INFERENCE.md

          if git diff --cached --quiet; then
            echo "Canonical analysis snapshot already matches the branch."
            exit 0
          fi

          git commit -m "research: preserve verified canonical main-study results"
          git push origin "HEAD:${GITHUB_REF_NAME}"
