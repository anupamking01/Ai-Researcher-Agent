name: live-app-smoke

on:
  workflow_dispatch:
    inputs:
      smart_model:
        description: Exact OpenAI model ID for planning and report generation
        required: true
        default: "gpt-5.6-terra"
        type: string
      fast_model:
        description: Exact OpenAI model ID for source summarization
        required: true
        default: "gpt-5.6-luna"
        type: string
  push:
    branches:
      - main
      - research-paper-eval-2027
    paths:
      - app.py
      - frontend/**
      - logic/**
      - scrape/**
      - settings/**
      - text_preprocess/**
      - scripts/smoke_test_app.py
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/live-app-smoke.yml

concurrency:
  group: live-app-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMART_LLM_MODEL: ${{ github.event.inputs.smart_model || 'gpt-5.6-terra' }}
      FAST_LLM_MODEL: ${{ github.event.inputs.fast_model || 'gpt-5.6-luna' }}
      TEMPERATURE: "1"
      USE_WEB_BROWSER: chrome
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate live-test secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run offline regression suite
        run: |
          python -m compileall -q agent logic scripts tests settings scrape text_preprocess app.py
          python -m pytest -q

      - name: Show browser and live model configuration
        run: |
          google-chrome --version || google-chrome-stable --version
          echo "SMART_LLM_MODEL=$SMART_LLM_MODEL"
          echo "FAST_LLM_MODEL=$FAST_LLM_MODEL"

      - name: Start FastAPI application
        shell: bash
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/live-app.log 2>&1 &
          echo $! > /tmp/live-app.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI health endpoint did not become ready."
          cat /tmp/live-app.log || true
          exit 1

      - name: Run live WebSocket research smoke test
        timeout-minutes: 10
        run: |
          python scripts/smoke_test_app.py \
            --base-url http://127.0.0.1:8000 \
            --timeout-seconds 520

      - name: Preserve server log
        if: always()
        shell: bash
        run: |
          mkdir -p outputs/smoke
          cp /tmp/live-app.log outputs/smoke/server.log 2>/dev/null || true

      - name: Stop FastAPI application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/live-app.pid ]; then
            kill "$(cat /tmp/live-app.pid)" 2>/dev/null || true
          fi

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-app-smoke-${{ github.run_id }}
          path: |
            outputs/smoke/server.log
            outputs/experiment_traces/**
            outputs/*/research_report.md
            outputs/*/research_report.pdf
          if-no-files-found: warn
          retention-days: 14
