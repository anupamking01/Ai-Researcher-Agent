name: analysis-freeze-chronology

# Historical, read-only Git ancestry and exact analysis-plan byte audit.
# This is NOT a treatment/evaluator rerun or proof of outcome blinding.
on:
  push:
    branches:
      - research-paper-eval-2027
    paths:
      - .github/workflows/analysis-freeze-chronology.yml
      - scripts/audit_analysis_plan_freeze_chronology.py
      - tests/test_analysis_plan_freeze_chronology.py
      - tests/test_analysis_freeze_chronology_workflow.py
      - docs/MAIN_STUDY_ANALYSIS_FREEZE_CHRONOLOGY.md
      - paper/RESEARCH_PROTOCOL.md
      - paper/ANALYSIS_PLAN.md
      - paper/HUMAN_EVAL_ANALYSIS_PLAN.md
      - paper/MAIN_STUDY_INFERENCE.md
      - paper/MAIN_STUDY_REPORTING_COVER.md
      - outputs/main_study_inference.json
  pull_request:
    paths:
      - .github/workflows/analysis-freeze-chronology.yml
      - scripts/audit_analysis_plan_freeze_chronology.py
      - tests/test_analysis_plan_freeze_chronology.py
      - tests/test_analysis_freeze_chronology_workflow.py
      - docs/MAIN_STUDY_ANALYSIS_FREEZE_CHRONOLOGY.md
      - paper/RESEARCH_PROTOCOL.md
      - paper/ANALYSIS_PLAN.md
      - paper/HUMAN_EVAL_ANALYSIS_PLAN.md
      - paper/MAIN_STUDY_INFERENCE.md
      - paper/MAIN_STUDY_REPORTING_COVER.md
      - outputs/main_study_inference.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-freeze-chronology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete Git ancestry without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up fixed offline Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.17"

      - name: Audit historical commits and freeze boundary without outcome access
        env:
          CHRONOLOGY_OUTPUT: ${{ runner.temp }}/vera-freeze-chronology/chronology.json
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$(dirname "$CHRONOLOGY_OUTPUT")"
          python -m scripts.audit_analysis_plan_freeze_chronology > "$CHRONOLOGY_OUTPUT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["CHRONOLOGY_OUTPUT"])
          raw = path.read_bytes()
          receipt = json.loads(raw)
          assert receipt["status"] == "verified_git_history_sequence_not_outcome_blinding"
          assert receipt["prior_protocol_precedes_treatments_in_git"] is True
          assert receipt["written_analysis_plan_postdates_treatment_commit_in_git"] is True
          assert receipt["written_analysis_plan_postdates_evaluator_recovery_commit_in_git"] is True
          assert receipt["written_analysis_plan_precedes_canonical_git_publication"] is True
          assert receipt["current_analysis_plan_bytes_equal_original_commit"] is True
          assert receipt["historical_prior_protocol_git_blob_sha"] == "706986c65eeb4628255198570e4e0f2fb48ee7ac"
          assert len(receipt["historical_prior_protocol_sha256"]) == 64
          assert receipt["historical_prior_protocol_candidate_variants"] == [
              "D3", "D6", "D12", "P3", "P6", "P12", "D6V", "P6V",
          ]
          assert receipt["realized_main_study_variants"] == ["D3", "D6", "P6", "P6V"]
          assert receipt["prior_candidate_matrix_identical_to_realized_matrix"] is False
          assert receipt["prior_protocol_specified_later_exact_holm_signflip_procedure"] is False
          assert receipt["prior_protocol_source_bound_not_exact_precollection_plan"] is True
          assert receipt["canonical_publication_report_bytes_unchanged"] is True
          assert receipt["canonical_publication_inference_json_bytes_unchanged"] is True
          assert receipt["separate_committed_reporting_cover_checked"] is True
          assert receipt["historical_report_contains_unqualified_preregistration_wording"] is True
          assert receipt["historical_human_analysis_plan_bytes_unchanged"] is True
          assert receipt["historical_human_plan_contains_unqualified_automated_preregistration_wording"] is True
          assert receipt["human_plan_freeze_does_not_backdate_automated_plan"] is True
          assert len(receipt["historical_human_analysis_plan_sha256"]) == 64
          for claim in (
              "prospective_precollection_analysis_preregistration_established",
              "pre_analysis_outcome_blinding_established",
              "original_treatment_authenticity_established",
              "human_validation_performed",
          ):
              assert receipt[claim] is False, claim
          index = {
              "schema_version": 1,
              "status": "git_chronology_audited_without_outcome_blinding_claim",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "checkout_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "chronology_receipt_sha256": hashlib.sha256(raw).hexdigest(),
              "historical_treatment_authenticity_established": False,
              "human_validation_performed": False,
          }
          (path.parent / "audit_index.json").write_text(
              json.dumps(index, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Retain Git-only chronology evidence (90 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vera-analysis-freeze-chronology-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vera-freeze-chronology/*.json
          if-no-files-found: error
          retention-days: 90
