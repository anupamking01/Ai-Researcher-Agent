name: live-research-pilot

on:
  workflow_dispatch:
    inputs:
      smart_model:
        description: Exact OpenAI model ID for planning/report/verifier calls
        required: true
        default: "gpt-5.6-terra"
        type: string
      fast_model:
        description: Exact OpenAI model ID for per-source summarization calls
        required: true
        default: "gpt-5.6-luna"
        type: string
      temperature:
        description: Sampling temperature; GPT-5.6 currently supports the provider default of 1
        required: true
        default: "1"
        type: string
      variants:
        description: Space-separated variants to run
        required: true
        default: "D6 P6 P6V"
        type: string
  push:
    branches:
      - research-paper-eval-2027
    paths:
      - experiments/run_live_pilot.trigger

concurrency:
  group: live-research-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMART_LLM_MODEL: ${{ github.event.inputs.smart_model || 'gpt-5.6-terra' }}
      FAST_LLM_MODEL: ${{ github.event.inputs.fast_model || 'gpt-5.6-luna' }}
      TEMPERATURE: ${{ github.event.inputs.temperature || '1' }}
      PILOT_VARIANTS: ${{ github.event.inputs.variants || 'D6 P6 P6V' }}
      USE_WEB_BROWSER: chrome
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Cancel older live-pilot runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live-pilot.yml/runs?status=in_progress&per_page=20" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              if [ -n "$run_id" ] && [ "$run_id" != "$GITHUB_RUN_ID" ]; then
                echo "Cancelling stale live-pilot run $run_id"
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
              fi
            done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate API secret is configured
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Show frozen pilot configuration
        run: |
          echo "SMART_LLM_MODEL=$SMART_LLM_MODEL"
          echo "FAST_LLM_MODEL=$FAST_LLM_MODEL"
          echo "TEMPERATURE=$TEMPERATURE"
          echo "PILOT_VARIANTS=$PILOT_VARIANTS"

      - name: Show browser version
        run: google-chrome --version || google-chrome-stable --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile and run offline tests first
        run: |
          python -m compileall -q agent logic scripts tests settings scrape text_preprocess
          python -m pytest -q

      - name: Run frozen live pilot
        timeout-minutes: 125
        shell: bash
        run: python scripts/run_pilot.py --variants $PILOT_VARIANTS

      - name: Summarize pilot
        if: always()
        run: |
          if find outputs/experiment_traces -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python scripts/summarize_pilot.py
          else
            echo "No experiment traces were produced."
          fi

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-pilot-${{ github.run_id }}
          path: |
            outputs/pilot_manifest.json
            outputs/pilot_progress.json
            outputs/pilot_summary.json
            outputs/pilot_runs.csv
            outputs/experiment_traces/**
            outputs/*/research_report.md
            outputs/*/verification.json
          if-no-files-found: warn
          retention-days: 30
