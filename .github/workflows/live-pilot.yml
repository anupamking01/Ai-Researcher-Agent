name: live-research-pilot

on:
  workflow_dispatch:
    inputs:
      smart_model:
        description: Exact OpenAI model ID for planning/report/verifier calls
        required: true
        type: string
      fast_model:
        description: Exact OpenAI model ID for per-source summarization calls
        required: true
        type: string
      temperature:
        description: Sampling temperature; use 0 for the frozen pilot
        required: true
        default: "0"
        type: string
      variants:
        description: Space-separated variants to run
        required: true
        default: "D6 P6 P6V"
        type: string

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMART_LLM_MODEL: ${{ inputs.smart_model }}
      FAST_LLM_MODEL: ${{ inputs.fast_model }}
      TEMPERATURE: ${{ inputs.temperature }}
      USE_WEB_BROWSER: chrome
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate API secret is configured
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Show browser version
        run: google-chrome --version || google-chrome-stable --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile and run offline tests first
        run: |
          python -m compileall -q agent logic scripts tests settings scrape text_preprocess
          python -m pytest -q

      - name: Run frozen live pilot
        shell: bash
        run: python scripts/run_pilot.py --variants ${{ inputs.variants }}

      - name: Summarize pilot
        if: always()
        run: |
          if find outputs/experiment_traces -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python scripts/summarize_pilot.py
          else
            echo "No experiment traces were produced."
          fi

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-pilot-${{ github.run_id }}
          path: |
            outputs/pilot_manifest.json
            outputs/pilot_summary.json
            outputs/pilot_runs.csv
            outputs/experiment_traces/**
            outputs/*/research_report.md
            outputs/*/verification.json
          if-no-files-found: warn
          retention-days: 30
